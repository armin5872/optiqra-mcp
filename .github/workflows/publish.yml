name: Publish to npm and MCP Registry

# Trigger by pushing a version tag, e.g.:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - "v*"
  # Lets you re-run manually from the Actions tab (e.g. if a run gets stuck)
  # by typing in the same tag again.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.1)"
        required: true

permissions:
  contents: read
  id-token: write # required for MCP Registry GitHub-OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22" # Trusted Publishing needs Node.js 22.14.0+
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Resolve version from tag
        id: version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify package.json / server.json version match the tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SRV_VERSION=$(node -p "require('./server.json').version")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$SRV_VERSION" != "$TAG_VERSION" ]; then
            echo "server.json version ($SRV_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Update npm (Trusted Publishing needs npm 11.5.1+)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Publish package to npm (Trusted Publishing / OIDC)
        run: npm publish --access public

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
